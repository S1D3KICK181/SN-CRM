<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <meta name='color-scheme' content='light' />
    <meta name='robots' content='noindex,nofollow' />
    <title>SN Practice CRM — Horizon preview</title>
    <link rel='icon' href='data:,' />
    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
    <link href='https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap' rel='stylesheet' />
    <link rel='stylesheet' href='./preview.css' />
  </head>
  <body>
    <div id='prototype-toolbar' class='prototype-toolbar'>
      <span class='prototype-context'>Horizon dashboard study <small>Desktop preview</small></span>
      <div id='variant-switcher' class='prototype-switcher' role='group' aria-label='Prototype variant switcher'>
        <button id='previous-variant' type='button' aria-label='Previous variant'>
          <svg class='icon' aria-hidden='true' viewBox='0 0 24 24'><path d='M15 18l-6-6 6-6'/></svg>
        </button>
        <span id='variant-label'>A · Horizon classic</span>
        <button id='next-variant' type='button' aria-label='Next variant'>
          <svg class='icon' aria-hidden='true' viewBox='0 0 24 24'><path d='M9 18l6-6-6-6'/></svg>
        </button>
      </div>
      <span class='prototype-status'>Production code unchanged</span>
    </div>

    <div id='app'></div>

    <button id='drawer-backdrop' class='drawer-backdrop' type='button' aria-label='Close assignment details' hidden></button>
    <aside id='assignment-drawer' class='assignment-drawer' role='dialog' aria-modal='true' aria-labelledby='drawer-title' aria-hidden='true' tabindex='-1' hidden></aside>
    <div id='toast-region' class='toast-region' aria-live='polite' aria-atomic='true'></div>

    <script type='module' src='./preview.js'></script>
  </body>
</html>
